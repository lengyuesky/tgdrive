services:
  tgdrive:
    # 优先使用发布镜像;拉不到时回退本地构建(保留 build 字段即可 fallback)
    image: ${TGDRIVE_IMAGE:-ghcr.io/lengyuesky/tgdrive:latest}
    build: .
    # 与宿主机 data 目录保持同一 UID/GID；默认桌面 Linux 用户通常是 1000。
    user: "${TGDRIVE_UID:-1000}:${TGDRIVE_GID:-1000}"
    # Bot API 的 local 文件默认属于 101:101 且目录权限为 750；补充该组才能只读缩略图。
    group_add:
      - "${TGDRIVE_BOT_API_GID:-101}"
    restart: unless-stopped
    ports:
      - "3358:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data
      # local 模式下直读 telegram-bot-api 的文件;官方 API 模式挂着也无害
      # 重要:挂载路径必须与 telegram-bot-api 容器内一致(getFile 返回绝对路径)
      - ./telegram-bot-api-data:/var/lib/telegram-bot-api:ro
      - ./bot-api-control:/bot-api-control
    environment:
      TGDRIVE_BOT_API_RESTART_FILE: /bot-api-control/restart
      TGDRIVE_BOT_API_PROXY_LISTEN: 0.0.0.0:1082
      TGDRIVE_BOT_API_PROXY_CONFIG: /bot-api-control/proxychains.conf

  # 自部署 Bot API 服务器,仅在启用 local-bot-api profile 时启动。
  # 需要在 .env 里配置 TELEGRAM_API_ID / TELEGRAM_API_HASH(https://my.telegram.org 申请);
  # 启动命令:docker compose --profile local-bot-api up -d
  telegram-bot-api:
    profiles: ["local-bot-api"]
    depends_on:
      tgdrive:
        condition: service_started
    image: ${TGDRIVE_BOT_API_IMAGE:-ghcr.io/lengyuesky/tgdrive-telegram-bot-api:latest}
    build:
      context: .
      dockerfile: Dockerfile.telegram-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      # local 模式:上传上限 2000MB,getFile 返回本地路径,tgdrive 经共享卷直读
      TELEGRAM_LOCAL: "1"
      TGDRIVE_BOT_API_RESTART_FILE: /bot-api-control/restart
      TGDRIVE_BOT_API_PROXY_CONFIG: /bot-api-control/proxychains.conf
    volumes:
      - ./telegram-bot-api-data:/var/lib/telegram-bot-api
      - ./bot-api-control:/bot-api-control
