[package]
name = "tgdrive"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
brotli = "8.0.4"
bytes = "1.12.1"
dav-server = "0.11.0"
dotenvy = "0.15.7"
flate2 = "1.1.9"
futures-util = "0.3.34"
grammers-client = { version = "0.10.0", default-features = false }
grammers-mtsender = "0.10.0"
grammers-session = { version = "0.10.0", default-features = false, features = ["serde"] }
grammers-tl-types = "0.10.0"
hmac = "0.13.0"
http = "1.5.0"
http-body-util = "0.1.4"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
pin-project-lite = "0.2.17"
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["json", "multipart", "query", "socks", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = "1.0"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["compression-br", "compression-gzip", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zip = { version = "8", default-features = false, features = ["deflate"] }

# 预压缩在安装时运行：压缩库在 dev 构建也按优化编译，浏览器测试夹具安装真实插件包不至于慢几十倍。
[profile.dev.package.brotli]
opt-level = 3
[profile.dev.package.brotli-decompressor]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.zlib-rs]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
