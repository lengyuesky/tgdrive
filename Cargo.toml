[package]
name = "tgdrive"
version = "0.3.4"
edition = "2024"

[dependencies]
age = "0.12.1"
anyhow = "1.0.104"
argon2 = "0.6"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
brotli = "8.0.4"
bytes = "1.12.1"
data-encoding = "2"
dav-server = "0.11.0"
dotenvy = "0.15.7"
flate2 = "1.1.9"
futures-util = "0.3.34"
grammers-client = { version = "0.10.0", default-features = false }
grammers-mtsender = "0.10.0"
grammers-session = { version = "0.10.0", default-features = false, features = ["serde"] }
grammers-tl-types = "0.10.0"
hmac = "0.13.0"
http = "1.5.0"
http-body = "1"
http-body-util = "0.1.4"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
pin-project-lite = "0.2.17"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["json", "multipart", "query", "socks", "stream"] }
semver = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["compression-br", "compression-gzip", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zip = { version = "8", default-features = false, features = ["deflate"] }

# 预压缩在安装时运行：压缩库在 dev 构建也按优化编译，浏览器测试夹具安装真实插件包不至于慢几十倍。
[profile.release]
# 单二进制服务：瘦 LTO 与去符号换更小的镜像，编译时间增加有限。
lto = "thin"
strip = true

[profile.dev.package.brotli]
opt-level = 3
[profile.dev.package.brotli-decompressor]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.zlib-rs]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
# argon2 / scrypt 在未优化构建下慢一两个数量级，测试里的登录与备份加密会被拖慢。
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
