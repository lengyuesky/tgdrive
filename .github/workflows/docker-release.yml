# 原生并行构建多架构镜像；主分支预热缓存，标签发布正式版。
# 手动运行默认只验证，也可指定已有标签重新发布，保持标签提交不变。
name: docker-release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/docker-release.yml"
      - "Dockerfile*"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "migrations/**"
      - "frontend/**"
      - "docker/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "已有版本标签；留空时验证所选分支"
        type: string
        default: ""
      publish:
        description: "发布镜像；须填写已有版本标签"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag || 'default' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.publish != true }}

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      publish: ${{ steps.source.outputs.publish }}
      repository: ${{ steps.source.outputs.repository }}
    steps:
      - name: 检出目标源码
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: 核验发布来源与版本
        id: source
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          tag="$INPUT_TAG"
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            publish=true
          elif [[ "$INPUT_PUBLISH" == true ]]; then
            publish=true
          fi
          if [[ -n "$tag" ]]; then
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "::error::版本标签须为 v主版本.次版本.修订版本"
              exit 1
            }
            [[ "$(git rev-parse "refs/tags/$tag^{commit}")" == "$(git rev-parse HEAD)" ]]
            version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
            [[ "$tag" == "v$version" ]] || {
              echo "::error::版本标签与 Cargo.toml 不一致"
              exit 1
            }
          elif [[ "$publish" == true ]]; then
            echo "::error::手动发布必须指定已有版本标签"
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: ${{ matrix.image }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        image: [tgdrive, telegram-bot-api]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: tgdrive
            suffix: ""
            dockerfile: Dockerfile
          - image: telegram-bot-api
            suffix: -telegram-bot-api
            dockerfile: Dockerfile.telegram-bot-api
    env:
      IMAGE: ghcr.io/${{ needs.prepare.outputs.repository }}${{ matrix.suffix }}
    steps:
      - name: 检出已核验提交
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: 核验原生架构并记录免费 runner 资源
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          case "$ARCH:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo "::error::runner 不是目标原生架构"; exit 1 ;;
          esac
          echo "架构：$(uname -m)，CPU：$(nproc)"
          free -h
          df -h /

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 原生构建并缓存单架构镜像
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          tags: ${{ needs.prepare.outputs.publish != 'true' && format('{0}:ci', env.IMAGE) || '' }}
          outputs: ${{ needs.prepare.outputs.publish == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=docker' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.tag || needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}-native
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}-native

      - name: 验证镜像可运行及媒体探测组件
        env:
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          DIGEST: ${{ steps.build.outputs.digest }}
          KIND: ${{ matrix.image }}
        run: |
          if [[ "$PUBLISH" == true ]]; then
            image="$IMAGE@$DIGEST"
          else
            image="$IMAGE:ci"
          fi
          if [[ "$KIND" == telegram-bot-api ]]; then
            docker run --rm --network none --entrypoint /bin/sh "$image" -euc '
              command -v proxychains4
              test -x /usr/local/bin/tgdrive-bot-api-supervisor
              sh -n /usr/local/bin/tgdrive-bot-api-supervisor
              telegram-bot-api --version
            '
            exit 0
          fi
          probe_dir="$(mktemp -d)"
          name="tgdrive-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true; rm -rf "$probe_dir"' EXIT
          # 仅生成一秒静音 WAV，不使用生产配置、媒体或 Telegram。
          PROBE_DIR="$probe_dir" node <<'NODE'
          const fs = require('node:fs')
          const b = Buffer.alloc(44 + 16000)
          b.write('RIFF'); b.writeUInt32LE(b.length - 8, 4); b.write('WAVEfmt ', 8)
          b.writeUInt32LE(16, 16); b.writeUInt16LE(1, 20); b.writeUInt16LE(1, 22)
          b.writeUInt32LE(8000, 24); b.writeUInt32LE(16000, 28)
          b.writeUInt16LE(2, 32); b.writeUInt16LE(16, 34)
          b.write('data', 36); b.writeUInt32LE(16000, 40)
          fs.writeFileSync(`${process.env.PROBE_DIR}/probe.wav`, b)
          NODE
          chmod 755 "$probe_dir"
          docker run --rm --network none --mount "type=bind,src=$probe_dir,dst=/probe,readonly" \
            --entrypoint /usr/local/bin/ffprobe "$image" -v error \
            -show_entries stream=codec_name -show_entries format=duration -of json /probe/probe.wav \
            > "$probe_dir/result.json"
          RESULT_FILE="$probe_dir/result.json" node <<'NODE'
          const fs = require('node:fs')
          const result = JSON.parse(fs.readFileSync(process.env.RESULT_FILE, 'utf8'))
          if (result.streams?.[0]?.codec_name !== 'pcm_s16le' || Number(result.format?.duration) !== 1) {
            throw new Error('最终镜像内的 FFprobe 未正确识别合成素材')
          }
          NODE
          docker run --detach --name "$name" --network none \
            --tmpfs /data:uid=1000,gid=1000 \
            -e TGDRIVE_USERNAME=ci-synthetic -e TGDRIVE_PASSWORD=ci-synthetic-only \
            "$image"
          for attempt in {1..30}; do
            [[ "$(docker inspect --format '{{.State.Running}}' "$name")" == true ]] || break
            if docker exec "$name" /usr/local/bin/tgdrive healthcheck >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$name"
          echo "::error::隔离容器健康检查未通过"
          exit 1

      - name: 保存已验证镜像摘要
        if: needs.prepare.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: 上传镜像摘要
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    name: 发布 ${{ matrix.image }} 多架构清单
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: tgdrive
            suffix: ""
          - image: telegram-bot-api
            suffix: -telegram-bot-api
    env:
      IMAGE: ghcr.io/${{ needs.prepare.outputs.repository }}${{ matrix.suffix }}
    steps:
      - name: 下载两种架构的已验证摘要
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成正式标签
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest

      - name: 合并并核验多架构清单
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          shopt -s nullglob
          digests=(*)
          [[ ${#digests[@]} == 2 ]] || {
            echo "::error::必须取得两种架构的镜像摘要"
            exit 1
          }
          refs=()
          for digest in "${digests[@]}"; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            refs+=("$IMAGE@sha256:$digest")
          done
          tags=()
          while IFS= read -r tag; do
            [[ -z "$tag" ]] || tags+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            docker buildx imagetools inspect "$tag" --raw > "$RUNNER_TEMP/manifest.json"
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' \
              "$RUNNER_TEMP/manifest.json"
          done <<< "$TAGS"
